name: Android Build & Release CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Install Android SDK 37 Platform
        run: |
          printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\n' | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Strict Zero Internet Permission
        run: |
          echo "Auditing all AndroidManifest.xml files for illegal internet permissions..."
          if grep -rn "android.permission.INTERNET" */src/main/AndroidManifest.xml; then
            echo "ERROR: Zero Internet Permission violated! android.permission.INTERNET detected."
            exit 1
          else
            echo "SUCCESS: Zero internet permissions confirmed across all modules."
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Decode Release Keystore (CI Environment)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
            echo "Decoded production release keystore from secrets."
          else
            echo "Generating CI build keystore for release artifact signing..."
            keytool -genkey -v -keystore my-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias elitememo -storepass elitememopass -keypass elitememopass \
              -dname "CN=EliteMemo, OU=Dev, O=Deepanjan, L=City, ST=State, C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: "${{ github.workspace }}/my-release-key.jks"
          STORE_PASSWORD: "${{ secrets.STORE_PASSWORD || 'elitememopass' }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS || 'elitememo' }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD || 'elitememopass' }}"
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EliteMemoPro-v1.0.5-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Release Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
